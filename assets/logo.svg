<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenRouter Account Factory logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#141B2E"/>
    </linearGradient>
    <linearGradient id="ring" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="108" stroke="#1E2836" stroke-width="3"/>

  <!-- orbit ring -->
  <circle cx="256" cy="256" r="150" stroke="url(#ring)" stroke-width="10" opacity="0.9"/>
  <circle cx="256" cy="256" r="112" stroke="#233047" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/>

  <!-- nodes on orbit -->
  <circle cx="256" cy="106" r="20" fill="url(#node)" filter="url(#glow)"/>
  <circle cx="386" cy="331" r="16" fill="#A78BFA"/>
  <circle cx="126" cy="331" r="16" fill="#22D3EE"/>

  <!-- central bolt -->
  <path d="M272 150 L196 274 H248 L232 362 L320 232 H266 Z"
        fill="url(#bolt)" stroke="#7C3AED" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- factory chimneys hint -->
  <rect x="150" y="392" width="34" height="44" rx="7" fill="#334155"/>
  <rect x="196" y="372" width="34" height="64" rx="7" fill="#3F4C63"/>
  <rect x="242" y="392" width="34" height="44" rx="7" fill="#334155"/>
  <circle cx="167" cy="380" r="7" fill="#64748B" opacity="0.7"/>
  <circle cx="213" cy="358" r="8" fill="#64748B" opacity="0.7"/>

  <!-- base bar -->
  <rect x="140" y="436" width="232" height="16" rx="8" fill="url(#ring)"/>
</svg>
